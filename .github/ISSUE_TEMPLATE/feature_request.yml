name: Feature request
description: Suggest a capability or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to find out or do that you cannot today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints this needs to respect
      options:
        - label: It records counts and structure only, never payload content
        - label: It adds no runtime dependency
