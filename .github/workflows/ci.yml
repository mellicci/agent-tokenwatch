name: ci

on:
  # Branches only: a release tag runs this matrix through publish.yml instead,
  # so it is not run twice for the same commit.
  push:
    branches: ['**']
  pull_request:
  # Called by publish.yml, so a release is only published after this exact
  # matrix has passed on the tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm pack --dry-run
      # There are no dependencies today, and this is what keeps it that way
      # visible rather than assumed.
      - run: npm audit --audit-level=high
